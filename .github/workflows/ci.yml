name: Cloud visual and functional QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node --check scripts/cloud-qa/run.mjs && node --check scripts/cloud-qa/provider-fixture.mjs
      - run: pnpm install --frozen-lockfile
      - name: Prepare cloud browser
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Download the published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p aiTemp/release
          gh release download v0.9.0 --dir aiTemp/release --repo p90-lover/dsh-plugin-codex-claude-auth
          (cd aiTemp/release && sha256sum -c SHA256SUMS)
      - name: Exercise native DSH and capture layout evidence
        env:
          QA_PLUGIN_PACKAGE: aiTemp/release/dsh-oauth-model-providers-0.9.0.tgz
        run: node scripts/cloud-qa/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-visual-functional-qa
          path: aiTemp/cloud-qa-results/
          if-no-files-found: error
