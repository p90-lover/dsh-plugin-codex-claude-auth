name: CI

on:
  push:
    branches:
      - feat/context-usage-failover-effort
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install current dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply staged tests and prove the regression
        if: ${{ hashFiles('scripts/apply-tests.mjs') != '' }}
        shell: bash
        run: |
          node scripts/apply-tests.mjs
          set +e
          pnpm exec vitest run \
            tests/context-window.spec.ts \
            tests/provider-usage.spec.ts \
            tests/failover-effort.spec.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Regression tests unexpectedly passed before the implementation was applied."
            exit 1
          fi
          echo "Regression tests failed before implementation as expected."

      - name: Apply staged implementation
        if: ${{ hashFiles('scripts/apply-tests.mjs') != '' }}
        run: |
          node scripts/apply-core.mjs
          node scripts/apply-client.mjs
          node scripts/apply-release.mjs
          rm scripts/apply-tests.mjs scripts/apply-core.mjs scripts/apply-client.mjs scripts/apply-release.mjs

      - name: Refresh lockfile for the client model-directory dependency
        if: ${{ hashFiles('scripts/apply-tests.mjs') == '' && hashFiles('scripts/apply-core.mjs') == '' }}
        run: pnpm install --frozen-lockfile

      - name: Update lockfile after staged implementation
        if: ${{ hashFiles('scripts/apply-tests.mjs') != '' || hashFiles('scripts/apply-core.mjs') != '' }}
        run: pnpm install --no-frozen-lockfile

      - name: Run typecheck, tests, and production build
        run: pnpm run check

      - name: Check generated diff
        run: git diff --check

      - name: Commit verified staged implementation
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add active-provider usage and extended context controls"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Pack plugin
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          sha256sum artifacts/*.tgz | tee artifacts/SHA256SUMS

      - name: Upload packed plugin
        uses: actions/upload-artifact@v4
        with:
          name: dsh-oauth-model-providers
          path: artifacts/
          if-no-files-found: error
