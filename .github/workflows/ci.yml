name: CI

on:
  push:
    branches:
      - feat/context-usage-failover-effort
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final review fixes
        if: ${{ hashFiles('scripts/final-review-fixes.mjs') != '' }}
        run: |
          node scripts/final-review-fixes.mjs
          rm scripts/final-review-fixes.mjs

      - name: Run typecheck, tests, and production build
        run: pnpm run check

      - name: Check repository diff
        run: git diff --check

      - name: Commit verified final review fixes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make custom context editable and preserve DSH compaction ownership"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Pack plugin
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          sha256sum artifacts/*.tgz | tee artifacts/SHA256SUMS

      - name: Upload packed plugin
        uses: actions/upload-artifact@v4
        with:
          name: dsh-oauth-model-providers
          path: artifacts/
          if-no-files-found: error
