# The alpha Harness requires this native flock binding at startup.
# Its install script only runs node-gyp configure/build from the locked source.
# Other dependency install scripts remain disabled.
onlyBuiltDependencies:
  - fs-ext

# Optional Office binaries are not used by the plugin verification environment.
ignoredOptionalDependencies:
  - '@deepseek-ai/libreoffice-kit-*'
